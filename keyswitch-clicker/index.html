<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キースイッチ・クラッシャー</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1e222b;
    --panel-2: #272c38;
    --line: #353b4a;
    --text: #e9ecf2;
    --muted: #98a1b3;
    --accent: #ffb547;
    --good: #6fdc8c;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 30% 20%, #232838 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 16px;
    max-width: 1100px;
    min-height: 100%;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .util { display: flex; gap: 8px; }
  .util button {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .util button:hover { background: var(--panel-2); }

  /* ---------- 左: ステージ ---------- */
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .scrap { text-align: center; }
  .scrap .num {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .scrap .unit { font-size: 13px; color: var(--muted); }
  .rates {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .rates b { color: var(--text); font-weight: 600; }

  .target-info { margin-top: 14px; text-align: center; }
  .target-name { font-size: 16px; font-weight: 700; }
  .target-name.boss { color: var(--bad); }
  .target-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .hp {
    width: min(360px, 100%);
    height: 18px;
    margin-top: 8px;
    background: #0e1015;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    position: relative;
  }
  .hp i {
    position: absolute; inset: 0;
    transform-origin: left center;
    background: linear-gradient(90deg, #ff6b6b, #ffb547 55%, #6fdc8c);
    transition: transform .08s linear;
  }
  .hp span {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    text-shadow: 0 1px 2px #000;
    font-variant-numeric: tabular-nums;
  }

  .arena {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 330px;
    display: grid;
    place-items: center;
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #switch {
    position: relative;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    width: 240px;
    height: 270px;
    outline-offset: 6px;
    touch-action: manipulation;
  }
  #switch svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #switch.boss svg { transform: scale(1.18); }
  #moving { transition: transform .06s ease-out; }
  #switch.down #moving { transform: translateY(15px); transition-duration: .02s; }
  #switch.shake svg { animation: shake .12s linear; }
  #switch.boss.shake svg { animation: shake-boss .12s linear; }
  #switch.spawn { animation: spawn .22s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0); }
    30% { transform: translate(-3px, 2px) rotate(-1.2deg); }
    65% { transform: translate(3px, 1px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  @keyframes shake-boss {
    0% { transform: scale(1.18) translate(0, 0) rotate(0); }
    30% { transform: scale(1.18) translate(-3px, 2px) rotate(-1.2deg); }
    65% { transform: scale(1.18) translate(3px, 1px) rotate(1deg); }
    100% { transform: scale(1.18) translate(0, 0) rotate(0); }
  }
  @keyframes spawn {
    from { transform: translateY(-50px) scale(.6); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .crack { stroke: #17181c; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .crack.on { opacity: .85; }

  .float {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    text-shadow: 0 2px 4px #000;
    animation: floatUp .8s ease-out forwards;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .float.crit { color: var(--accent); font-size: 30px; }
  .float.gain { color: var(--good); font-size: 18px; }
  @keyframes floatUp {
    from { transform: translate(-50%, -50%) scale(.7); opacity: 1; }
    20% { transform: translate(-50%, -90%) scale(1.15); }
    to { transform: translate(-50%, -220%) scale(1); opacity: 0; }
  }
  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  /* ---------- 右: 工具店 ---------- */
  .shop {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    align-self: start;
  }
  .shop h2 {
    margin: 10px 4px 6px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: .08em;
  }
  .shop h2:first-child { margin-top: 2px; }
  .item {
    width: 100%;
    display: grid;
    grid-template-columns: 40px 1fr auto;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: transform .05s, border-color .1s, opacity .1s;
  }
  .item:not(:disabled):hover { border-color: var(--accent); }
  .item:not(:disabled):active { transform: scale(.985); }
  .item:disabled { opacity: .45; cursor: not-allowed; }
  .item .ico { font-size: 26px; text-align: center; line-height: 1; }
  .item .nm { font-size: 14px; font-weight: 700; }
  .item .ds { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .item .rt { text-align: right; font-variant-numeric: tabular-nums; }
  .item .cost { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .item .lv { font-size: 11px; color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(20px);
    background: #000c;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 10px; gap: 10px; }
    h1 { font-size: 13px; letter-spacing: 0; }
    .util { flex-shrink: 0; }
    h1 small { display: none; }
    .arena { min-height: 300px; }
    .scrap .num { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #switch.shake svg, #switch.spawn { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⌨️ キースイッチ・クラッシャー<small>叩いて、割って、ばらばらに</small></h1>
    <div class="util">
      <button id="btnSound" type="button" aria-pressed="true">🔊 音</button>
      <button id="btnReset" type="button">最初から</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="破壊ステージ">
    <div class="scrap">
      <div class="num" id="scrap">0</div>
      <div class="unit">スクラップ</div>
    </div>
    <div class="rates">
      <span>1打 <b id="perClick">1</b></span>
      <span>毎秒 <b id="perSec">0</b></span>
      <span>会心 <b id="critRate">5%</b></span>
      <span>破壊数 <b id="broken">0</b></span>
    </div>

    <div class="target-info">
      <div class="target-name" id="targetName"></div>
      <div class="target-sub" id="targetSub"></div>
      <div class="hp" role="progressbar" aria-label="耐久" aria-valuemin="0" aria-valuemax="100" id="hpBar">
        <i id="hpFill"></i><span id="hpText"></span>
      </div>
    </div>

    <div class="arena" id="arena">
      <canvas id="fx"></canvas>
      <button id="switch" type="button" aria-label="キースイッチを叩く">
        <svg viewBox="0 0 240 270" aria-hidden="true">
          <defs>
            <linearGradient id="gHouse" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a4f5c"/><stop offset="1" stop-color="#2a2d36"/>
            </linearGradient>
          </defs>
          <ellipse cx="120" cy="258" rx="92" ry="9" fill="#0008"/>
          <!-- ピン -->
          <rect x="88" y="244" width="7" height="16" rx="2" fill="#d9b24a"/>
          <rect x="140" y="244" width="7" height="16" rx="2" fill="#d9b24a"/>
          <rect x="112" y="244" width="16" height="10" rx="3" fill="#23252c"/>
          <!-- 動く部分: 軸とキーキャップ -->
          <g id="moving">
            <rect id="stem" x="102" y="150" width="36" height="52" rx="4" fill="#e0443e"/>
            <rect id="capSkirt" x="28" y="26" width="184" height="140" rx="20" fill="#9aa0ad"/>
            <rect id="capTop" x="46" y="32" width="148" height="108" rx="15" fill="#d5d9e2"/>
            <rect x="52" y="36" width="136" height="20" rx="10" fill="#fff" opacity=".28"/>
            <text id="legend" x="120" y="103" text-anchor="middle" font-size="52" font-weight="800"
                  font-family="system-ui, sans-serif" fill="#2b2e36">A</text>
            <path class="crack" id="crack1" d="M70 34 L88 62 L78 84 L98 104"/>
            <path class="crack" id="crack2" d="M190 70 L160 82 L150 110 L124 120 L118 150 M150 110 L170 132"/>
            <path class="crack" id="crack3" d="M40 120 L72 112 L98 104 L112 128 L96 160 M88 62 L120 56 L140 36"/>
          </g>
          <!-- ハウジング -->
          <path d="M66 186 H174 L196 216 H44 Z" fill="url(#gHouse)" opacity=".94"/>
          <rect x="40" y="214" width="160" height="34" rx="7" fill="#1d1f26"/>
          <rect x="40" y="214" width="160" height="6" rx="3" fill="#3a3e4a"/>
        </svg>
      </button>
    </div>
    <div class="hint">クリック・タップ、またはキーボードを叩いて破壊！(押しっぱなしは無効)</div>
  </section>

  <aside class="shop" id="shop" aria-label="工具店"></aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  // ---------- データ ----------
  const SWITCH_TYPES = [
    { name: '赤軸', kind: 'リニア', color: '#e0443e' },
    { name: '茶軸', kind: 'タクタイル', color: '#8a5a3c' },
    { name: '青軸', kind: 'クリッキー', color: '#3d7be0' },
    { name: '黒軸', kind: '重めのリニア', color: '#2a2a2e' },
    { name: '銀軸', kind: 'スピード', color: '#c9ced8' },
    { name: '桃軸', kind: '静音', color: '#f09ab8' },
    { name: '緑軸', kind: '重めのクリッキー', color: '#3fae5a' },
    { name: '紫軸', kind: '光学式', color: '#8f5fe0' },
    { name: '金軸', kind: '磁気式', color: '#e0b23d' },
    { name: '白軸', kind: '静電容量無接点', color: '#f2f2f2' },
  ];
  const BOSS_KEYS = ['Enter', 'Space', 'Shift', 'Tab', 'Ctrl', 'Esc', 'Del', 'Caps'];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  // kind: click = 1打の威力, auto = 毎秒ダメージ, crit = 会心率
  const ITEMS = [
    { id: 'finger', kind: 'click', ico: '☝️', name: '指トレ', val: 1, base: 15 },
    { id: 'puller', kind: 'click', ico: '🗜️', name: 'キープラー', val: 5, base: 200 },
    { id: 'driver', kind: 'click', ico: '🪛', name: 'マイナスドライバー', val: 25, base: 2500 },
    { id: 'hammer', kind: 'click', ico: '🔨', name: 'ハンマー', val: 120, base: 20000 },
    { id: 'drill', kind: 'click', ico: '🛠️', name: '電動ドリル', val: 600, base: 200000 },
    { id: 'crit', kind: 'crit', ico: '🎯', name: '急所ねらい', val: 2, base: 300, growth: 1.3, max: 25 },
    { id: 'cat', kind: 'auto', ico: '🐈', name: 'キーボードに乗る猫', val: 1, base: 50 },
    { id: 'coffee', kind: 'auto', ico: '☕', name: 'こぼれたコーヒー', val: 6, base: 500 },
    { id: 'rage', kind: 'auto', ico: '👊', name: '台パン', val: 30, base: 4000 },
    { id: 'solder', kind: 'auto', ico: '🔥', name: 'はんだごて', val: 150, base: 30000 },
    { id: 'press', kind: 'auto', ico: '🏭', name: '油圧プレス', val: 800, base: 250000 },
    { id: 'laser', kind: 'auto', ico: '🛰️', name: '衛星レーザー', val: 4500, base: 2500000 },
  ];
  const SECTIONS = [
    ['click', '工具(1打の威力)'],
    ['crit', '技'],
    ['auto', '自動破壊(毎秒)'],
  ];
  const SAVE_KEY = 'keyswitch-crusher-v1';
  const CRIT_MULT = 5;

  // ---------- 状態 ----------
  const fresh = () => ({ scrap: 0, total: 0, broken: 0, level: 1, hp: 0, owned: {}, sound: true });
  let S = fresh();
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw && typeof raw === 'object') S = Object.assign(fresh(), raw);
  } catch (e) { /* 保存が読めなくても遊べる */ }
  const save = () => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 同上 */ }
  };

  const lv = id => S.owned[id] || 0;
  const cost = it => Math.floor(it.base * Math.pow(it.growth || 1.15, lv(it.id)));
  const sumOf = kind => ITEMS.filter(i => i.kind === kind).reduce((a, i) => a + i.val * lv(i.id), 0);
  const clickPower = () => 1 + sumOf('click');
  const autoPower = () => sumOf('auto');
  const critChance = () => (5 + sumOf('crit')) / 100;

  const isBoss = level => level % 10 === 0;
  const maxHp = level => Math.floor(10 * Math.pow(1.12, level - 1)) * (isBoss(level) ? 5 : 1);
  const reward = level => Math.ceil(maxHp(level) * (isBoss(level) ? 3 : 1) * (1 + level * 0.02));

  const UNITS = ['', '万', '億', '兆', '京', '垓', '𥝱', '穣'];
  function fmt(n) {
    n = Math.floor(n);
    if (n < 10000) return n.toLocaleString('ja-JP');
    let u = 0;
    while (n >= 10000 && u < UNITS.length - 1) { n /= 10000; u++; }
    return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + UNITS[u];
  }

  // ---------- 要素 ----------
  const $ = id => document.getElementById(id);
  const el = {
    scrap: $('scrap'), perClick: $('perClick'), perSec: $('perSec'), critRate: $('critRate'),
    broken: $('broken'), targetName: $('targetName'), targetSub: $('targetSub'),
    hpFill: $('hpFill'), hpText: $('hpText'), hpBar: $('hpBar'),
    arena: $('arena'), sw: $('switch'), fx: $('fx'), shop: $('shop'), toast: $('toast'),
    stem: $('stem'), capSkirt: $('capSkirt'), capTop: $('capTop'), legend: $('legend'),
    cracks: [$('crack1'), $('crack2'), $('crack3')],
    btnSound: $('btnSound'), btnReset: $('btnReset'),
  };

  // ---------- 音 ----------
  let actx = null;
  function audio() {
    if (!S.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { return null; }
    return actx;
  }
  function noise(dur, freq, vol) {
    const a = audio();
    if (!a) return;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = a.createGain();
    g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination);
    src.start();
  }
  let lastSnd = 0;
  function sndHit(crit) {
    const now = performance.now();
    if (now - lastSnd < 25) return;
    lastSnd = now;
    noise(0.05, crit ? 1500 : 2600 + Math.random() * 900, crit ? 0.5 : 0.28);
  }
  function sndBreak(boss) {
    noise(boss ? 0.5 : 0.22, boss ? 500 : 900, 0.6);
    noise(0.12, 3200, 0.25);
  }

  // ---------- パーティクル ----------
  const ctx = el.fx.getContext('2d');
  let parts = [];
  let fxW = 0, fxH = 0;
  function resizeFx() {
    const r = el.arena.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxW = r.width; fxH = r.height;
    el.fx.width = Math.round(fxW * dpr);
    el.fx.height = Math.round(fxH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeFx);

  function burst(x, y, n, colors, power, shapes) {
    for (let i = 0; i < n && parts.length < 400; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = power * (0.3 + Math.random());
      parts.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - power * 0.6,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
        size: 3 + Math.random() * 6,
        color: colors[(Math.random() * colors.length) | 0],
        shape: shapes[(Math.random() * shapes.length) | 0],
        life: 0.7 + Math.random() * 0.7, age: 0,
      });
    }
  }
  function drawParts(dt) {
    ctx.clearRect(0, 0, fxW, fxH);
    if (!parts.length) return;
    for (const p of parts) {
      p.age += dt;
      p.vy += 900 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      const a = Math.max(0, 1 - p.age / p.life);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.shape === 'spring') {
        ctx.strokeStyle = '#d9b24a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i <= 8; i++) {
          const px = (i % 2 ? 1 : -1) * p.size * 0.9, py = (i - 4) * p.size * 0.55;
          if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        }
        ctx.stroke();
      } else if (p.shape === 'cap') {
        ctx.fillStyle = p.color;
        const s = p.size * 2.4;
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.fillStyle = '#ffffff55';
        ctx.fillRect(-s / 2 + 2, -s / 2 + 2, s - 4, s * 0.3);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      }
      ctx.restore();
    }
    parts = parts.filter(p => p.age < p.life && p.y < fxH + 40);
  }

  function floatText(text, x, y, cls) {
    if (el.arena.querySelectorAll('.float').length > 40) return;
    const s = document.createElement('span');
    s.className = 'float' + (cls ? ' ' + cls : '');
    s.textContent = text;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.addEventListener('animationend', () => s.remove());
    el.arena.appendChild(s);
  }

  // ---------- スイッチ ----------
  let capColors = ['#d5d9e2', '#9aa0ad'];
  let stemColor = '#e0443e';
  let defaultLegend = 'A';

  function setLegend(t) {
    el.legend.textContent = t;
    el.legend.setAttribute('font-size', t.length > 3 ? 30 : t.length > 1 ? 38 : 52);
    el.legend.setAttribute('y', t.length > 1 ? 98 : 103);
  }

  function dressSwitch(animate) {
    const L = S.level;
    const boss = isBoss(L);
    const type = SWITCH_TYPES[Math.floor((L - 1) / 10) % SWITCH_TYPES.length];
    stemColor = type.color;
    el.stem.setAttribute('fill', stemColor);
    if (boss) {
      capColors = ['#ffd27a', '#b8842a'];
      defaultLegend = BOSS_KEYS[(L / 10 - 1) % BOSS_KEYS.length];
    } else {
      const hue = (L * 47) % 360;
      capColors = [`hsl(${hue} 28% 84%)`, `hsl(${hue} 18% 58%)`];
      defaultLegend = LETTERS[(L * 7) % LETTERS.length];
    }
    el.capTop.setAttribute('fill', capColors[0]);
    el.capSkirt.setAttribute('fill', capColors[1]);
    setLegend(defaultLegend);
    el.sw.classList.toggle('boss', boss);
    el.targetName.textContent = boss ? `👑 ${defaultLegend}キー(${type.name})` : `${type.name}スイッチ`;
    el.targetName.classList.toggle('boss', boss);
    el.targetSub.textContent = `Lv.${L} ・ ${type.kind} ・ 報酬 ${fmt(reward(L))}`;
    if (animate) {
      el.sw.classList.remove('spawn');
      void el.sw.offsetWidth;
      el.sw.classList.add('spawn');
    }
  }

  function drawHp() {
    const m = maxHp(S.level);
    const r = Math.max(0, Math.min(1, S.hp / m));
    el.hpFill.style.transform = `scaleX(${r})`;
    el.hpText.textContent = `${fmt(Math.ceil(S.hp))} / ${fmt(m)}`;
    el.hpBar.setAttribute('aria-valuenow', Math.round(r * 100));
    el.cracks[0].classList.toggle('on', r < 0.75);
    el.cracks[1].classList.toggle('on', r < 0.5);
    el.cracks[2].classList.toggle('on', r < 0.25);
  }

  function center() {
    const a = el.arena.getBoundingClientRect();
    const s = el.sw.getBoundingClientRect();
    return { x: s.left - a.left + s.width / 2, y: s.top - a.top + s.height * 0.42 };
  }

  let lastBreakFx = 0;
  function breakSwitch() {
    const L = S.level;
    const boss = isBoss(L);
    const gain = reward(L);
    S.scrap += gain; S.total += gain; S.broken++;
    S.level++;
    S.hp = maxHp(S.level);
    const now = performance.now();
    if (now - lastBreakFx > 90) {
      lastBreakFx = now;
      const c = center();
      burst(c.x, c.y, boss ? 46 : 22, capColors, boss ? 520 : 380, ['cap', 'chip', 'chip']);
      burst(c.x, c.y + 40, boss ? 14 : 6, [stemColor, '#2a2d36', '#d9b24a'], 320, ['chip', 'spring']);
      floatText('+' + fmt(gain), c.x, c.y - 70, 'gain');
      sndBreak(boss);
      dressSwitch(true);
    } else {
      dressSwitch(false);
    }
    dirty = true;
  }

  // ダメージを与える。あふれた分は次のスイッチへ持ち越す
  function damage(amount) {
    let guard = 0;
    while (amount > 0 && guard++ < 500) {
      const take = Math.min(amount, S.hp);
      S.hp -= take;
      amount -= take;
      if (S.hp <= 0) breakSwitch();
    }
  }

  let upTimer = 0;
  function hit(x, y, label) {
    const crit = Math.random() < critChance();
    const dmg = clickPower() * (crit ? CRIT_MULT : 1);
    if (x == null) {
      const c = center();
      x = c.x + (Math.random() - 0.5) * 90;
      y = c.y + (Math.random() - 0.5) * 50;
    }
    if (label) setLegend(label);
    floatText((crit ? '会心 ' : '') + fmt(dmg), x, y - 20, crit ? 'crit' : '');
    burst(x, y, crit ? 10 : 4, capColors, crit ? 300 : 200, ['chip']);
    sndHit(crit);
    el.sw.classList.add('down');
    el.sw.classList.remove('shake');
    void el.sw.offsetWidth;
    el.sw.classList.add('shake');
    clearTimeout(upTimer);
    upTimer = setTimeout(() => el.sw.classList.remove('down'), 70);
    damage(dmg);
    drawHp();
  }

  // ---------- 工具店 ----------
  const itemEls = {};
  function buildShop() {
    for (const [kind, title] of SECTIONS) {
      const h = document.createElement('h2');
      h.textContent = title;
      el.shop.appendChild(h);
      for (const it of ITEMS.filter(i => i.kind === kind)) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'item';
        const desc = it.kind === 'click' ? `1打 +${fmt(it.val)}`
          : it.kind === 'auto' ? `毎秒 +${fmt(it.val)}`
          : `会心率 +${it.val}%(会心は${CRIT_MULT}倍)`;
        b.innerHTML = `<span class="ico" aria-hidden="true">${it.ico}</span>
          <span><div class="nm">${it.name}</div><div class="ds">${desc}</div></span>
          <span class="rt"><div class="cost"></div><div class="lv"></div></span>`;
        b.addEventListener('click', e => {
          buy(it);
          if (e.detail > 0) b.blur(); // マウス・タッチのあとはキーボード連打に戻れるように
        });
        el.shop.appendChild(b);
        itemEls[it.id] = { b, cost: b.querySelector('.cost'), lv: b.querySelector('.lv') };
      }
    }
  }
  function buy(it) {
    const c = cost(it);
    if (S.scrap < c || (it.max && lv(it.id) >= it.max)) return;
    S.scrap -= c;
    S.owned[it.id] = lv(it.id) + 1;
    noise(0.08, 1200, 0.2);
    dirty = true;
    render();
    save();
  }

  let dirty = true;
  function setText(node, t) { if (node.textContent !== t) node.textContent = t; }
  function render() {
    setText(el.scrap, fmt(S.scrap));
    setText(el.perClick, fmt(clickPower()));
    setText(el.perSec, fmt(autoPower()));
    setText(el.critRate, Math.round(critChance() * 100) + '%');
    setText(el.broken, fmt(S.broken));
    for (const it of ITEMS) {
      const e = itemEls[it.id];
      const maxed = it.max && lv(it.id) >= it.max;
      setText(e.cost, maxed ? '最大' : fmt(cost(it)));
      setText(e.lv, '所持 ' + lv(it.id));
      e.b.disabled = maxed || S.scrap < cost(it);
    }
    dirty = false;
  }

  let toastTimer = 0;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
  }

  // ---------- 入力 ----------
  el.sw.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const a = el.arena.getBoundingClientRect();
    hit(e.clientX - a.left, e.clientY - a.top);
  });
  el.sw.addEventListener('contextmenu', e => e.preventDefault());

  const KEY_LABELS = { ' ': 'Space', Enter: 'Enter', Backspace: 'BS', Shift: 'Shift', Control: 'Ctrl', Alt: 'Alt' };
  window.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Tab' || e.key === 'Escape' || /^F\d+$/.test(e.key)) return;
    const ae = document.activeElement;
    const onControl = ae && ae !== el.sw && ae.tagName === 'BUTTON';
    if (onControl && (e.key === 'Enter' || e.key === ' ')) return; // ボタンの操作を優先
    if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') e.preventDefault();
    const label = isBoss(S.level) ? null
      : KEY_LABELS[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : null);
    hit(null, null, label);
  });

  function drawSoundBtn() {
    el.btnSound.textContent = S.sound ? '🔊 音' : '🔇 音';
    el.btnSound.setAttribute('aria-pressed', String(S.sound));
  }
  el.btnSound.addEventListener('click', () => {
    S.sound = !S.sound;
    drawSoundBtn();
    save();
  });
  el.btnReset.addEventListener('click', () => {
    if (!confirm('スクラップも工具もすべて消して、最初からやり直しますか？')) return;
    const sound = S.sound;
    S = fresh();
    S.sound = sound;
    S.hp = maxHp(1);
    parts = [];
    dressSwitch(true);
    drawHp();
    render();
    save();
  });

  // ---------- ループ ----------
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 3600); // タブを離れていた分も最大1時間まで進める
    last = now;
    const dps = autoPower();
    if (dps > 0) {
      damage(dps * dt);
      drawHp();
    }
    drawParts(Math.min(dt, 0.05));
    acc += dt;
    if (dirty || acc > 0.25) { render(); acc = 0; }
    requestAnimationFrame(frame);
  }

  // ---------- 開始 ----------
  buildShop();
  if (!(S.hp > 0) || S.hp > maxHp(S.level)) S.hp = maxHp(S.level);
  dressSwitch(false);
  drawHp();
  drawSoundBtn();
  render();
  resizeFx();
  if (S.total > 0) toast('おかえりなさい。つづきから再開します');
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
